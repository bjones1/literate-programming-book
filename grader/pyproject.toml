#
# Project
# =======
[project]
name = "grader"
version = "0.1.0"
description = "Export a Microsoft Teams channel's chat history for grading."
authors = [{ name = "Bryan A. Jones", email = "bjones460@gmail.com" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    # Microsoft's own authentication library. It implements the device code
    # flow and, just as importantly, handles refresh-token rotation, so that
    # you sign in once rather than once per run.
    "msal (>=1.31,<2.0)",
    "requests (>=2.32,<3.0)",
    # The command-line interface. Typer builds it from the type annotations on
    # `export <grader/teams_export.py>`_, and brings Rich along for the
    # help and error formatting.
    "typer (>=0.12,<1.0)",
    # Windows ships no system time zone database, so ``zoneinfo`` -- used by
    # ``--tz`` -- needs this. Installed only where it is needed.
    "tzdata (>=2025.2) ; sys_platform == 'win32'",
]

# Installing this project provides each tool as a command.
[project.scripts]
teams-export = "grader.teams_export:main"
git-grade = "grader.git_homework:main"

# The checks run by `pre_commit_check.py <tests/pre_commit_check.py>`_, plus
# the type stubs ty needs for third-party libraries. ``uv sync`` installs this
# group by default, so no extra flag is needed to get the check tools.
[dependency-groups]
dev = [
    "coverage>=7.0",
    "pytest>=8.0",
    "ruff>=0.14",
    # ty is pre-1.0 and still changing; pin the minor version it was checked against.
    "ty>=0.0.81,<0.1",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package to build. Hatchling cannot guess it here, since the project is
# named ``grader`` but so is the directory above it.
[tool.hatch.build.targets.wheel]
packages = ["grader"]


# Ruff
# ====
# Ruff replaces Black (as ``ruff format``) and both Flake8 and isort (as ``ruff
# check``).
[tool.ruff]
# Pin this rather than letting Ruff infer it from ``requires-python``, so that
# the formatting and lint results do not change when the range does.
target-version = "py311"

[tool.ruff.lint]
# ``E4``/``E7``/``E9`` and ``F`` are Ruff's defaults, and are what Flake8
# checked here. ``I`` adds isort's import ordering, which Flake8 did not check.
#
# Note that ``E501`` (line too long) is deliberately absent, as it was under
# Flake8, where ``max-line-length`` was set high enough to disable it: this
# project is written as prose-first literate programming, so its comments run
# to whatever length the sentence needs and are wrapped by the editor.
select = ["E4", "E7", "E9", "F", "I"]


# pytest
# ======
[tool.pytest.ini_options]
testpaths = [
    "tests",
]


# ty
# ==
[tool.ty.src]
# Check everything in this directory. Build products and the virtual
# environment are excluded by ty's defaults, but ``.grader-cache`` -- written
# by ``git-grade`` -- is not.
exclude = ["build", "dist", ".grader-cache"]
